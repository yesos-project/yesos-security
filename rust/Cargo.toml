[package]
name = "yesos"
version = "0.1.0"
edition = "2021"
description = "YesOS Security - Rust part: the bridge firewall"

# The one staticlib of this product: the core crate plus this product's modules.
[lib]
name = "yesos"
crate-type = ["staticlib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[dependencies]
yesos_core = { path = "../core/rust", features = ["dns", "intercept", "frames"] }
